# say2type 配置示例
# 用法：cp config.example.toml config.toml 后按需修改。
# 本地 config.toml 已在 .gitignore 中忽略，不会提交（API key 只写本地）。

[audio]
# avfoundation 输入设备序号，执行 `say2type devices` 查看。
# null = 系统默认麦克风；本机示例：1 = 外置麦克风，2 = MacBook Pro 麦克风
device = 1
sample_rate = 16000
channels = 1
# 单次录音最长秒数（兜底，防止忘记停止）
max_duration = 30.0
# 静音自动停止：开口思考时建议先关闭，熟悉后再打开
silence_stop = false
silence_db = -40.0
silence_seconds = 2.0
# 录音文件保存目录，留空则使用系统临时目录
output_dir = ""

[asr]
enabled = true
# sherpa = 进程内 sherpa-onnx，直接读本地 ONNX 模型，无需起服务（默认）
# openai = OpenAI 兼容的远程 /v1/audio/transcriptions 服务
# mock   = 离线假数据，用于无模型联调
backend = "sherpa"

# ---- sherpa 后端参数 ----
# 与 voice-record 共享的 SenseVoice-Small 模型目录（含 model.int8.onnx / tokens.txt）
sherpa_model_dir = "~/.voice-record/models/sherpa-onnx-sense-voice-small"
sherpa_num_threads = 4
# ITN 逆文本正则化：口语数字/日期转规范写法
sherpa_use_itn = true
# zh / en / auto / ja / ko / yue
language = "zh"

# ---- openai 后端参数（backend = "openai" 时生效） ----
base_url = "http://localhost:8000/v1"
api_key = ""
model = "whisper-1"
timeout = 60.0
extra_prompt = ""

[llm]
enabled = true
# openai = OpenAI 兼容接口（oMLX / Ollama 均适用）；mock = 原样透传 ASR 文本
backend = "openai"
# oMLX 本地服务（实测清洗延迟：热请求约 0.7s）
base_url = "http://127.0.0.1:8000/v1"
# 在 oMLX App 的设置中生成/查看；Ollama 留空即可。请勿提交到仓库
api_key = "sk-omlx-在这里替换成你的key"
# 听写清洗推荐小模型：冷启动约 3s、热请求约 0.7s；
# 27B 常驻大模型实测需要 8~12s，不适合听写场景
model = "Qwen3-VL-8B-Instruct-4bit"
timeout = 60.0
temperature = 0.1
max_tokens = 1024

[injector]
# true = 模拟 Cmd+V 注入当前光标；false = 仅打印结果（调试用）
enabled = true
paste_delay = 0.15
restore_clipboard = true
restore_delay = 0.3

[rules]
# 相对于本配置文件所在目录
system_prompt = "rules/system_prompt.md"
custom_vocab = "rules/custom_vocab.txt"
